name: Drayven MinGW Core SDK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mingw-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 ninja-build

      - name: Configure core-only MinGW SDK
        run: >-
          cmake -S . -B build-mingw -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-x64.cmake
          -DDRAYVEN_BUILD_STUDIO=OFF
          -DDRAYVEN_BUILD_TESTS=OFF
          -DDRAYVEN_WITH_COCOS=OFF
          -DDRAYVEN_BUILD_SHARED_ENGINE=OFF
          -DDRAYVEN_BUILD_STATIC_ENGINE=ON
          -DDRAYVEN_ENABLE_MBEDTLS=ON

      - name: Build libDrayvenEngine.a
        run: cmake --build build-mingw --target DrayvenEngineStatic --parallel 4

      - name: Stage MinGW SDK
        run: python3 tools/stage_sdk.py --build build-mingw --output dist/mingw-x64 --platform windows-mingw-x64

      - uses: actions/upload-artifact@v4
        with:
          name: DrayvenEngine-MinGW-x64-core
          path: dist/mingw-x64
          if-no-files-found: error
          compression-level: 6
