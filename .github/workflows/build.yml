name: Drayven Universal SDK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DRAYVEN_VERSION: 0.3.0

jobs:
  windows:
    name: Windows x64 Studio + SDK
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bootstrap pinned Cocos2d-x and FairyGUI
        run: python tools/bootstrap_vendor.py

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDRAYVEN_BUILD_STUDIO=ON
          -DDRAYVEN_BUILD_TESTS=ON
          -DDRAYVEN_WITH_COCOS=ON
          -DDRAYVEN_ENABLE_MBEDTLS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test DRYS/core
        run: ctest --test-dir build --output-on-failure

      - name: Stage Windows SDK
        run: python tools/stage_sdk.py --build build --output dist/windows-x64 --platform windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: DrayvenEngine-Windows-x64
          path: dist/windows-x64
          if-no-files-found: error
          compression-level: 6

  linux:
    name: Linux x64 Studio + SDK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Linux graphics and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build build-essential pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libglew-dev libglfw3-dev \
            libx11-dev libxi-dev libxrandr-dev libxxf86vm-dev \
            libfontconfig1-dev libfreetype6-dev \
            libasound2-dev libpulse-dev libgtk-3-dev

      - name: Bootstrap pinned Cocos2d-x and FairyGUI
        run: python tools/bootstrap_vendor.py

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DDRAYVEN_BUILD_STUDIO=ON
          -DDRAYVEN_BUILD_TESTS=ON
          -DDRAYVEN_WITH_COCOS=ON
          -DDRAYVEN_ENABLE_MBEDTLS=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test DRYS/core
        run: ctest --test-dir build --output-on-failure

      - name: Stage Linux SDK
        run: python tools/stage_sdk.py --build build --output dist/linux-x64 --platform linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: DrayvenEngine-Linux-x64
          path: dist/linux-x64
          if-no-files-found: error
          compression-level: 6

  android:
    name: Android arm64-v8a SDK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android NDK r21e
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529"
          echo "DRAYVEN_NDK=${ANDROID_HOME}/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Bootstrap pinned Cocos2d-x and FairyGUI
        run: python tools/bootstrap_vendor.py

      - name: Configure Android arm64-v8a
        run: >-
          cmake -S . -B build-android -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${DRAYVEN_NDK}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-21
          -DANDROID_STL=c++_static
          -DDRAYVEN_BUILD_STUDIO=OFF
          -DDRAYVEN_BUILD_TESTS=OFF
          -DDRAYVEN_WITH_COCOS=ON
          -DDRAYVEN_BUILD_SHARED_ENGINE=ON
          -DDRAYVEN_BUILD_STATIC_ENGINE=ON
          -DDRAYVEN_ENABLE_MBEDTLS=ON

      - name: Build Android runtime
        run: cmake --build build-android --parallel 4

      - name: Stage Android SDK
        run: python tools/stage_sdk.py --build build-android --output dist/android-arm64-v8a --platform android-arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: DrayvenEngine-Android-arm64-v8a
          path: dist/android-arm64-v8a
          if-no-files-found: error
          compression-level: 6

  universal:
    name: Universal SDK bundle
    runs-on: ubuntu-22.04
    needs: [windows, linux, android]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: DrayvenEngine-*
          path: collected

      - name: Assemble all-platform SDK
        run: |
          mkdir -p universal/windows-x64 universal/linux-x64 universal/android-arm64-v8a universal/licenses
          cp -a collected/DrayvenEngine-Windows-x64/. universal/windows-x64/
          cp -a collected/DrayvenEngine-Linux-x64/. universal/linux-x64/
          cp -a collected/DrayvenEngine-Android-arm64-v8a/. universal/android-arm64-v8a/
          cp THIRD_PARTY_NOTICES.md universal/licenses/
          cp LICENSE universal/licenses/DRAYVEN_LICENSE.txt
          printf '%s\n' \
            'DrayvenEngine 0.3.0 Universal SDK' \
            'Editor UI: FairyGUI-cocos2dx' \
            'Engine foundation: Cocos2d-x v4' \
            'Scripting: DRYS + optional LuaJIT runtime bridge' \
            'Targets included: Windows x64, Linux x64, Android arm64-v8a' \
            'NoesisGUI SDK is intentionally not redistributed.' \
            > universal/README-SDK.txt
          cd universal
          zip -r ../DrayvenEngine-0.3.0-Universal-SDK.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: DrayvenEngine-0.3.0-Universal-SDK
          path: DrayvenEngine-0.3.0-Universal-SDK.zip
          if-no-files-found: error
          compression-level: 0
