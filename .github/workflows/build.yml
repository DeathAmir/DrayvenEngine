name: Build Drayven Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  desktop:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-only]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DrayvenEngine-Windows-x64
          - os: ubuntu-latest
            artifact: DrayvenEngine-Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential git make pkg-config cmake ninja-build
          libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev
          libxi-dev libxfixes-dev libxkbcommon-dev libxss-dev libxtst-dev
          libasound2-dev libpulse-dev libwayland-dev libdecor-0-dev

      - name: Enable MSVC command environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build LuaJIT on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git third_party\LuaJIT
          cd third_party\LuaJIT\src
          call msvcbuild.bat

      - name: Build LuaJIT on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git third_party/LuaJIT
          make -C third_party/LuaJIT amalg -j2

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: drayven-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDRAYVEN_ENABLE_MBEDTLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage SDK
        shell: bash
        run: |
          mkdir -p dist/bin dist/lib
          cp -r build/bin/* dist/bin/ || true
          cp -r build/lib/* dist/lib/ || true
          cp -r include assets templates docs cmake tools dist/
          cp CMakeLists.txt README.md LICENSE dist/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp third_party/LuaJIT/src/luajit.exe dist/bin/
            cp third_party/LuaJIT/src/lua51.dll dist/bin/
            mkdir -p dist/bin/lua
            cp -r third_party/LuaJIT/src/jit dist/bin/lua/
          else
            cp third_party/LuaJIT/src/luajit dist/bin/
            cp -a third_party/LuaJIT/src/libluajit.so* dist/bin/ || true
            mkdir -p dist/bin/lua
            cp -r third_party/LuaJIT/src/jit dist/bin/lua/
          fi
          cmake -E tar cfv "${{ matrix.artifact }}.zip" --format=zip dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  android:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y build-essential git make ninja-build cmake

      - name: Build LuaJIT Android arm64
        shell: bash
        run: |
          git clone --depth 1 --branch v2.1 https://github.com/LuaJIT/LuaJIT.git third_party/LuaJIT
          NDK="$ANDROID_NDK_LATEST_HOME"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$BIN/aarch64-linux-android24-clang"
          make -C third_party/LuaJIT -j2 \
            CROSS="$BIN/aarch64-linux-android-" \
            STATIC_CC="$CC" \
            DYNAMIC_CC="$CC -fPIC" \
            TARGET_LD="$CC" \
            TARGET_AR="$BIN/llvm-ar rcus" \
            TARGET_STRIP="$BIN/llvm-strip" \
            TARGET_SYS=Linux

      - name: Configure Android NDK
        shell: bash
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DDRAYVEN_BUILD_EDITOR=OFF \
            -DDRAYVEN_BUILD_TESTS=OFF \
            -DDRAYVEN_ENABLE_VULKAN=OFF \
            -DDRAYVEN_ENABLE_MBEDTLS=ON \
            -DDRAYVEN_BUILD_SHARED_ENGINE=ON

      - name: Build Android engine
        run: cmake --build build-android --target DrayvenEngine --parallel 2

      - name: Stage Android SDK
        shell: bash
        run: |
          mkdir -p dist-android/lib/arm64-v8a dist-android/include dist-android/tools
          SO="$(find build-android -name 'libDrayvenEngine.so' -type f | head -1)"
          test -n "$SO"
          cp "$SO" dist-android/lib/arm64-v8a/
          cp third_party/LuaJIT/src/libluajit.so dist-android/lib/arm64-v8a/ || cp third_party/LuaJIT/src/libluajit-5.1.so* dist-android/lib/arm64-v8a/
          cp -r include/drayven dist-android/include/
          cp tools/build_luajit_android.sh dist-android/tools/
          cp docs/ANDROID.md docs/SCRIPTING.md LICENSE dist-android/
          cmake -E tar cfv "DrayvenEngine-Android-arm64-v8a.zip" --format=zip dist-android

      - uses: actions/upload-artifact@v4
        with:
          name: DrayvenEngine-Android-arm64-v8a
          path: DrayvenEngine-Android-arm64-v8a.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[release-only]')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.run_id }}
      RELEASE_TAG: v0.2.${{ github.run_number }}
    steps:
      - name: Publish release through GitHub API
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.parse, urllib.request, zipfile

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['SOURCE_RUN_ID']
          tag = os.environ['RELEASE_TAG']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'DrayvenEngine-Release'
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as res:
                  return json.load(res)

          def json_request(url, payload, method='POST'):
              body = json.dumps(payload).encode()
              h = dict(headers); h['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=body, headers=h, method=method)
              with urllib.request.urlopen(req) as res:
                  return json.load(res) if res.length != 0 else {}

          run = get_json(f'{api}/actions/runs/{run_id}')
          target_sha = run['head_sha']
          artifacts = get_json(f'{api}/actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          out = pathlib.Path('release-assets'); out.mkdir(exist_ok=True)
          selected = [a for a in artifacts if a['name'].startswith('DrayvenEngine-') and not a.get('expired')]
          if len(selected) < 3:
              raise SystemExit(f'Expected 3 Drayven artifacts, found {len(selected)}')
          for a in selected:
              archive = out / f"{a['name']}.artifact.zip"
              req = urllib.request.Request(a['archive_download_url'], headers=headers)
              with urllib.request.urlopen(req) as res, archive.open('wb') as f:
                  f.write(res.read())
              with zipfile.ZipFile(archive) as z:
                  z.extractall(out)
              archive.unlink()

          release = None
          try:
              release = get_json(f'{api}/releases/tags/{urllib.parse.quote(tag)}')
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
          if release is None:
              release = json_request(f'{api}/releases', {
                  'tag_name': tag,
                  'target_commitish': target_sha,
                  'name': f'Drayven Engine {tag}',
                  'body': 'Automated Windows, Linux and Android ARM64 SDK release.',
                  'draft': False,
                  'prerelease': False,
                  'generate_release_notes': True
              })
          else:
              for asset in release.get('assets', []):
                  if asset['name'].startswith('DrayvenEngine-'):
                      req = urllib.request.Request(f"{api}/releases/assets/{asset['id']}", headers=headers, method='DELETE')
                      urllib.request.urlopen(req).read()

          upload_base = release['upload_url'].split('{', 1)[0]
          files = sorted(out.glob('DrayvenEngine-*.zip'))
          if len(files) < 3:
              raise SystemExit(f'Expected 3 release ZIPs, found {len(files)}')
          for file in files:
              url = upload_base + '?' + urllib.parse.urlencode({'name': file.name})
              h = dict(headers); h['Content-Type'] = 'application/zip'
              req = urllib.request.Request(url, data=file.read_bytes(), headers=h, method='POST')
              with urllib.request.urlopen(req) as res:
                  asset = json.load(res)
                  print('uploaded', asset['name'], asset['browser_download_url'])
          print('release', release['html_url'])
          PY

  recovery_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-only]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Recover release from an existing successful run
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.error, urllib.parse, urllib.request, zipfile

          msg = os.environ['COMMIT_MESSAGE']
          run_match = re.search(r'source-run=(\d+)', msg)
          tag_match = re.search(r'tag=([^\s]+)', msg)
          if not run_match or not tag_match:
              raise SystemExit('release-only commit must include source-run=<id> tag=<tag>')
          run_id = run_match.group(1)
          tag = tag_match.group(1)
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'DrayvenEngine-Release-Recovery'
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as res:
                  return json.load(res)

          def json_request(url, payload, method='POST'):
              body = json.dumps(payload).encode()
              h = dict(headers); h['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=body, headers=h, method=method)
              with urllib.request.urlopen(req) as res:
                  return json.load(res) if res.length != 0 else {}

          run = get_json(f'{api}/actions/runs/{run_id}')
          if run.get('conclusion') not in ('success', 'failure'):
              print('source run state:', run.get('status'), run.get('conclusion'))
          target_sha = run['head_sha']
          artifacts = get_json(f'{api}/actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          out = pathlib.Path('release-assets'); out.mkdir(exist_ok=True)
          selected = [a for a in artifacts if a['name'].startswith('DrayvenEngine-') and not a.get('expired')]
          if len(selected) < 3:
              raise SystemExit(f'Expected 3 Drayven artifacts, found {len(selected)}')
          for a in selected:
              archive = out / f"{a['name']}.artifact.zip"
              req = urllib.request.Request(a['archive_download_url'], headers=headers)
              with urllib.request.urlopen(req) as res, archive.open('wb') as f:
                  f.write(res.read())
              with zipfile.ZipFile(archive) as z:
                  z.extractall(out)
              archive.unlink()

          release = None
          try:
              release = get_json(f'{api}/releases/tags/{urllib.parse.quote(tag)}')
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
          if release is None:
              release = json_request(f'{api}/releases', {
                  'tag_name': tag,
                  'target_commitish': target_sha,
                  'name': f'Drayven Engine {tag}',
                  'body': 'Windows x64, Linux x64 and Android ARM64 SDKs from validated GitHub Actions artifacts.',
                  'draft': False,
                  'prerelease': False,
                  'generate_release_notes': True
              })
          else:
              for asset in release.get('assets', []):
                  if asset['name'].startswith('DrayvenEngine-'):
                      req = urllib.request.Request(f"{api}/releases/assets/{asset['id']}", headers=headers, method='DELETE')
                      urllib.request.urlopen(req).read()

          upload_base = release['upload_url'].split('{', 1)[0]
          files = sorted(out.glob('DrayvenEngine-*.zip'))
          if len(files) < 3:
              raise SystemExit(f'Expected 3 release ZIPs, found {len(files)}')
          for file in files:
              url = upload_base + '?' + urllib.parse.urlencode({'name': file.name})
              h = dict(headers); h['Content-Type'] = 'application/zip'
              req = urllib.request.Request(url, data=file.read_bytes(), headers=h, method='POST')
              with urllib.request.urlopen(req) as res:
                  asset = json.load(res)
                  print('uploaded', asset['name'], asset['browser_download_url'])
          print('release', release['html_url'])
          PY
